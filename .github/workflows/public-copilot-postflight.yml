          REPOS
          cat > "$root/test-one.sh" <<'SCRIPT'
          set -euo pipefail
          repo="$1"
          tested_base="$2"
          i="$3"
          cd "$root/checkouts"
          git -c core.autocrlf=false -c core.hooksPath=/dev/null clone -q --depth 2 --single-branch --no-tags --no-recurse-submodules --branch infra/copilot-config-20261125 "https://github.com/$repo.git" "$i"
          cd "$i"
          head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$tested_base"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD | wc -l | tr -d ' ')" = 3
          for p in .github/copilot-instructions.md .github/agents/portfolio-verifier.agent.md .github/skills/evidence-gated-delivery/SKILL.md; do
            test -f "$p"
            test ! -L "$p"
            test "$(git diff-tree --no-commit-id --name-status -r HEAD -- "$p" | cut -f1)" = A
            test "$(git rev-parse "HEAD:$p")" = "$(git hash-object --no-filters "$root/expected/$(basename "$p")")"
          done
          export COPILOT_HOME="$root/home-$i"
          mkdir -p "$COPILOT_HOME"
          "$bin" skill list --json > "$root/skills-$i.json"
          "$bin" instruction list --json > "$root/instructions-$i.json"
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const c=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));if(!Array.isArray(s)||!s.some(x=>x.name==="evidence-gated-delivery"&&x.enabled!==false))throw Error("candidate skill missing");if(!Array.isArray(c)||!c.some(x=>JSON.stringify(x).includes("copilot-instructions.md")))throw Error("candidate instructions missing")' "$root/skills-$i.json" "$root/instructions-$i.json"
          printf 'POSTFLIGHT_PASS %s %s %s\n' "$repo" "$tested_base" "$head"
          SCRIPT
          i=0
          failed=0
          while read -r repo base; do
            i=$((i+1))
            if bash "$root/test-one.sh" "$repo" "$base" "$i"; then
              :
            else
              printf 'POSTFLIGHT_FAIL %s\n' "$repo"
              failed=$((failed+1))
            fi
          done < "$root/repos.txt"
          printf 'PUBLIC_POSTFLIGHT attempted=%s failed=%s\n' "$i" "$failed"
          test "$i" -eq 52
          test "$failed" -eq 0
          printf 'Exact added configuration blobs and unauthenticated instruction/skill discovery only. No authenticated agent invocation or application-runtime certification.\n'
