          The-New-Witness/the-new-witness 0906ae46f61dc4675c5c7457f9a2005dd92d3e6e
          REPOS
          cat > "$root/one.sh" <<'SCRIPT'
          set -euo pipefail
          repo="$1"; expected="$2"; idx="$3"
          cd "$root"
          git -c core.autocrlf=false -c core.hooksPath=/dev/null clone -q --depth 1 --single-branch --no-tags --no-recurse-submodules --branch infra/copilot-config-20261125 "https://github.com/$repo.git" "$idx"
          cd "$idx"
          test "$(git rev-parse HEAD)" = "$expected"
          # Parse every tracked Python file without executing imports or code.
          python -c 'import subprocess,pathlib; p=[x for x in subprocess.check_output(["git","ls-files","-z"]).decode().split("\0") if x.endswith(".py")]; [compile(pathlib.Path(x).read_bytes(),x,"exec") for x in p]; print("PYTHON_SYNTAX_FILES",len(p))'
          case "$repo" in
            sENZ5hFx/copilot-cli)
              bash -n install.sh test/install_test.sh
              if [ "$(uname -s)" = Linux ]; then bash test/install_test.sh; else echo "Installer suite declared Linux only; non-Linux syntax only"; fi ;;
            sENZ5hFx/whole-question-demo) python site/verify.py ;;
            Define-Web-Design/plemerad1991.github.io) python -m unittest discover -s tests -p test_static_site_integrity.py -v; python scripts/check_static_html.py . ;;
            The-New-Witness/the-new-witness) python -m unittest discover -s tests -v; python scripts/validate_archive.py ;;
            sENZ5hFx/remainder-growth-class-2026-10-09) python -m unittest -v test_rgc_evidence ;;
            sENZ5hFx/false-saturation-class-2026-10-12) python fsc_score.py ;;
            sENZ5hFx/kind-substitution-refused-2026-10-13) python kind_gate.py ;;
            sENZ5hFx/kind-substitution-class-2026-10-13) python ksc_score.py ;;
            sENZ5hFx/kind-overshoot-refused-2026-10-15) python ko_screen.py ;;
            sENZ5hFx/kind-overshoot-still-refused-2026-10-19) python oa_pointer_audit.py ;;
            sENZ5hFx/fill-privilege-class-2026-10-04) python fpc_score.py ;;
            sENZ5hFx/knowledge-gap-frontier-2026) python oxygen_kind_gate_2026-11-06.py ;;
            sENZ5hFx/chrome-devtools-mcp) echo "Separate native project test matrix required"; printf 'PROJECT_DEFERRED %s %s\n' "$repo" "$expected"; exit 0 ;;
            *)
              if git ls-files | grep -Eq '\.(py|js|cjs|mjs|ts|sh|ps1|rb|go|rs|swift|ipynb|html|htm)$'; then
                printf 'SOURCE_ONLY %s %s (syntax checks only, no reviewed runnable test selected)\n' "$repo" "$expected"
              else
                printf 'NO_APP_SOURCE_FOUND %s %s (no executable application source detected by this inventory)\n' "$repo" "$expected"
              fi
              exit 0 ;;
          esac
          printf 'PROJECT_CHECK_PASS %s %s\n' "$repo" "$expected"
          SCRIPT
          i=0; failed=0
          while read -r repo expected; do
            i=$((i+1))
            if bash "$root/one.sh" "$repo" "$expected" "$i"; then :; else
              printf 'PROJECT_CHECK_FAIL %s %s\n' "$repo" "$expected"
              failed=$((failed+1))
            fi
          done < "$root/targets"
          printf 'PROJECT_SCAN attempted=%s failed=%s\n' "$i" "$failed"
          test "$i" -eq 52
          test "$failed" -eq 0
