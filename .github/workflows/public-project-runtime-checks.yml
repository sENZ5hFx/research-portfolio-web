name: Public exact-head project runtime checks
# Read-only, public checkouts; no secrets, publishing, or external model calls.
on:
  push:
    branches: [ci/copilot-cross-platform-canary-20261125]
    paths: ['.github/workflows/public-project-runtime-checks.yml']
permissions: {}
jobs:
  project-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Test declared project checks and classify research scripts
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          node --version
          python --version
          root="$(mktemp -d)"
          trap 'rm -rf -- "$root"' EXIT
          export root
          cat > "$root/targets" <<'REPOS'
